# 构建 Android APK(医哲未来人工智能研究院 IMPF-AI 出品)。
# 推 main 或手动触发;产物上传为 Artifact,并发布/更新到 "apk-latest" Release。
#
# 覆盖安装升级(不丢数据)的两个前提在此保证:
# 1. 稳定签名:优先使用 Secrets 提供的私有密钥(ANDROID_KEYSTORE_BASE64 等),
#    未配置时回退到仓库内置分发密钥 apps/web/android/keystore/ziwei-dist.jks;
#    两种方式下每次构建的签名都一致,Android 才允许直接覆盖安装。
# 2. 递增版本号:versionCode = 1000 + GITHUB_RUN_NUMBER,versionName = 包版本.构建号。
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Resolve version
        id: ver
        run: |
          PKG=$(node -p "require('./apps/web/package.json').version")
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "name=${PKG}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Build web assets
        env:
          VITE_APP_VERSION: ${{ steps.ver.outputs.name }}
        run: npm run -w @ziwei/web build
      - name: Capacitor sync
        working-directory: apps/web
        run: npx cap sync android
      - name: Prepare signing key (Secrets take precedence over the bundled distribution key)
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "source=secrets" >> "$GITHUB_OUTPUT"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "source=bundled" >> "$GITHUB_OUTPUT"
          fi
      - name: Gradle assemble (release, signed)
        working-directory: apps/web/android
        env:
          ZIWEI_VERSION_CODE: ${{ steps.ver.outputs.code }}
          ZIWEI_VERSION_NAME: ${{ steps.ver.outputs.name }}
          ZIWEI_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          ZIWEI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ZIWEI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZIWEI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verify signature and version
        run: |
          APK=apps/web/android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "SHA-256|Signer" | head -3
          "$BT/aapt" dump badging "$APK" | grep -oE "versionCode='[0-9]+' versionName='[^']+'"
          mkdir -p out
          cp "$APK" out/ziwei-workbench-IMPF-AI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-workbench-apk
          path: out/ziwei-workbench-IMPF-AI.apk
      - name: Publish to apk-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 紫微斗数工作台 APK(IMPF-AI)
          body: |
            医哲未来人工智能研究院(IMPF-AI)出品。版本 ${{ steps.ver.outputs.name }}(versionCode ${{ steps.ver.outputs.code }})。
            三盘合一:紫微盘 · 八字盘 · 星座盘(西洋占星:星盘轮、行星落座落宫、相位、元素平衡、小限与过境流年);
            智能体五种命理体系(紫微 / 八字 / 星座 / 紫微+八字 / 三系统互参),档案可任意点选组合做群盘多轮解读。
            排盘/全国城市真太阳时/六级运限下钻/本地档案与群盘全离线;
            AI 解读在 App 内「设置」置入自己的 API Key(直连模式)。

            **确认版本**:安装后打开「设置 → 关于」,应显示 v${{ steps.ver.outputs.name }},且「星盘」页顶部有「紫微盘 | 八字盘 | 星座盘」三个按钮。
            0.1.0.12 及更早的版本会缓存旧界面:从这些版本升级时,首次打开可能闪现旧界面并自动刷新一次;
            若仍看到旧界面,请在「设置 → 关于」点「清除页面缓存并重新载入」(档案、对话与设置不受影响)。

            **升级说明**:所有 APK 使用同一签名密钥(签名源:${{ steps.key.outputs.source }}),
            可直接覆盖安装,档案/对话/设置全部保留。
            若手机上装的是 2026-09-17 之前的旧版(旧版每次构建签名不同),首次升级需先卸载旧版,
            请先在旧版「智能体 → 历史 → 导出全部历史」保存对话;此后即可在「设置 → 数据备份」一键备份/恢复。
            安装时允许「未知来源」。
          files: out/ziwei-workbench-IMPF-AI.apk
          prerelease: false
